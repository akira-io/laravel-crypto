name: Laravel Crypto - CI Pipeline

on:
  push:
    branches:
      - '1.x'
  pull_request:
    branches:
      - '1.x'

jobs:
  install_dependencies:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: [8.2, 8.3, 8.4]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Setup PHP with the matrix version
      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, bcmath, openssl

      # Install Composer
      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | php
          php composer.phar --version

      # Clear Composer cache to prevent issues with old packages
      - name: Clear Composer cache
        run: composer clear-cache

      # Install Composer dependencies
      - name: Install dependencies with Composer
        run: |
          composer install --no-interaction --prefer-dist --dev

  run_tests:
    runs-on: ubuntu-latest
    needs: install_dependencies
    strategy:
      matrix:
        php-version: [8.2, 8.3, 8.4]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Setup PHP again to run tests with the matrix PHP version
      - name: Set up PHP ${{ matrix.php-version }} for testing
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, bcmath, openssl

      # Run tests with Pest
      - name: Run tests with Pest
        run: |
          composer install --no-interaction --prefer-dist --dev
          vendor/bin/pest